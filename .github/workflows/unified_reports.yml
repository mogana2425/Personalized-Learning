name: PLIS Unified E2E & Security Test Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node_version: '18'

      - name: Verify Environment & Connectivity
        run: |
          echo "Verifying PLIS Deployment environment..."
          node -v
          npm -v

  run-backend-api-tests:
    name: Run Backend API Tests
    runs-on: ubuntu-latest
    needs: verify-deployment
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node_version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Execute Backend API & Security Tests
        run: npm run test:backend

      - name: Upload Backend Test Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-test-results
          path: reports/backend_results.json

  run-frontend-build:
    name: Run Frontend Build
    runs-on: ubuntu-latest
    needs: verify-deployment
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node_version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App & Frontend Bundles
        run: npm run test:build

      - name: Upload Frontend Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build-results
          path: reports/frontend_results.json

  run-api-load-tests:
    name: Run API Load Tests
    runs-on: ubuntu-latest
    needs: verify-deployment
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node_version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Execute API Load Testing Suite
        run: npm run test:load

      - name: Upload Load Test Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: load-test-results
          path: reports/load_results.json

  run-appium-tests:
    name: Run Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: [verify-deployment, run-backend-api-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node_version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Execute Appium & E2E Mobile/Web Tests
        run: npm run test:e2e

      - name: Upload Appium Excel Report
        uses: actions/upload-artifact@v3
        with:
          name: appium-excel-reports
          path: reports/Appium_Test_Report.xlsx

      - name: Upload E2E Test Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: reports/e2e_results.json

  consolidate-and-verify-reports:
    name: Consolidate & Verify Reports
    runs-on: ubuntu-latest
    needs: [verify-deployment, run-backend-api-tests, run-frontend-build, run-api-load-tests, run-appium-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node_version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          path: reports_artifacts

      - name: Consolidate Verification Metrics & Generate Dashboard
        run: npm run test:consolidate

      - name: Upload Final Consolidated Verification Dashboard
        uses: actions/upload-artifact@v3
        with:
          name: unified-verification-dashboard
          path: reports/Unified_Test_Verification_Dashboard.md
